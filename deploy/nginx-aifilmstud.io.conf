# aifilmstud.io — Nginx reverse proxy (HTTP + HTTPS).
# Live copy: /etc/nginx/sites-available/aifilmstud.io
#
# Do not copy listen [::]:443 ssl ipv6only=on from the aielegance.com site —
# that flag may only appear once on the box.
#
# Cert lives at /etc/letsencrypt/live/aifilmstud.io/
# Renewals: certbot renew (timer already installed).

server {
    listen 80;
    listen [::]:80;
    server_name aifilmstud.io www.aifilmstud.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aifilmstud.io www.aifilmstud.io;

    client_max_body_size 110m;

    ssl_certificate /etc/letsencrypt/live/aifilmstud.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aifilmstud.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /pb/ {
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
