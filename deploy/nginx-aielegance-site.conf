# AI Elegance — Nginx reverse proxy (HTTP). After DNS works:
#   sudo cp /path/to/nginx-aielegance-site.conf /etc/nginx/sites-available/aielegance
#   sudo ln -sf /etc/nginx/sites-available/aielegance /etc/nginx/sites-enabled/aielegance
#   sudo rm -f /etc/nginx/sites-enabled/default   # optional: avoid default_server clash
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot install --nginx  (or: certbot --nginx -d aielegance.com -d www.aielegance.com)
#
# Requires: PocketBase on 127.0.0.1:8090, Nuxt on 127.0.0.1:3000
#
# After certbot adds an SSL server block, copy client_max_body_size into that block too
# (default nginx limit is 1MB and causes 413 on reference-image uploads / large JSON).

server {
    listen 80;
    listen [::]:80;
    server_name aielegance.com www.aielegance.com;

    # Screenplay + Speech to Text uploads (STT allows 100MB; keep nginx above app limit)
    client_max_body_size 110m;

    location /pb/ {
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:8090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long LLM / image jobs (default nginx 60s causes 504 on slow models)
    location / {
        client_max_body_size 110m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
