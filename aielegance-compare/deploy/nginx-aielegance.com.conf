# aielegance.com — compare app (NOT Film Studio).
# Live: retarget the existing aielegance site with scripts/apply-nginx.sh
# rather than blindly replacing a Certbot-managed file.
#
# Film Studio stays on aifilmstud.io → 127.0.0.1:3000
# This vhost should proxy / → 127.0.0.1:3001
#
# Do not copy listen [::]:443 ssl ipv6only=on from another site.

server {
    listen 80;
    listen [::]:80;
    server_name aielegance.com www.aielegance.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aielegance.com www.aielegance.com;

    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/aielegance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aielegance.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
